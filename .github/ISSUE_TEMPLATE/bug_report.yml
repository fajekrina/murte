name: Bug report
description: Something in Murte isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal JSON payload + engine wiring that triggers it, if you can.
      render: typescript
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Murte / browser / OS versions
      placeholder: "murte 0.1.0 · Chrome 140 · macOS 15 / Android 15"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, a failing test, or the fixture that reproduces it.
